<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sketch 004 · Comment threads · Loopnote</title>
<link rel="stylesheet" href="../themes/default.css">
<style>*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#050608;color:var(--text-primary);font-family:var(--font-ui);font-size:var(--font-size-ui);line-height:var(--line-height-ui);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:1px solid var(--focus-ring);outline-offset:-1px}

/* ---------- sketch chrome (not part of the design) ---------- */
#variant-nav{position:fixed;top:0;left:0;right:0;height:36px;z-index:9998;display:flex;align-items:center;gap:6px;padding:0 12px;background:#050608;border-bottom:1px solid #222;font:12px/1 system-ui,sans-serif;overflow-x:auto}
#variant-nav .sk-title{color:#8a8a8a;margin-right:6px;white-space:nowrap}
#variant-nav .sk-sep{width:1px;height:18px;background:#2a2a2a;margin:0 6px;flex:none}
#variant-nav .sk-label{color:#6f6f6f;white-space:nowrap}
.variant-tab,.state-tab{background:transparent;border:1px solid #333;color:#bbb;padding:5px 10px;border-radius:4px;cursor:pointer;transition:all .15s ease;white-space:nowrap;font:12px/1 system-ui,sans-serif}
.variant-tab:hover,.state-tab:hover{border-color:#777;color:#fff}
.variant-tab.active{background:#f2f2f2;color:#000;border-color:#f2f2f2}
.state-tab.active{border-color:#f2f2f2;color:#fff}
#stage{position:absolute;top:36px;bottom:0;left:0;right:0;margin:0 auto;transition:max-width .2s ease;overflow:hidden;container-type:inline-size;container-name:stage}
#stage.constrained{outline:1px dashed #444}
.variant{display:none;position:absolute;inset:0}
.variant.active{display:block}
#sketch-tools{position:fixed;bottom:30px;right:12px;z-index:9999;font:12px/1 system-ui,sans-serif;background:rgba(0,0,0,.82);color:#fff;padding:6px 8px;border-radius:8px;opacity:.35;transition:opacity .2s;display:flex;gap:4px;align-items:center}
#sketch-tools:hover{opacity:1}
#sketch-tools select,#sketch-tools button{background:#1b1b1b;border:1px solid #3a3a3a;color:#ddd;border-radius:4px;padding:3px 6px;cursor:pointer;font:12px system-ui,sans-serif}
#sketch-tools button:hover{border-color:#888}
#sketch-tools button.on{background:#fff;color:#000}
#sk-annot-tip{position:fixed;z-index:10000;pointer-events:none;background:#000;color:#9fe;font:11px/1.45 ui-monospace,monospace;padding:6px 8px;border-radius:4px;border:1px solid #333;white-space:pre;display:none}
.sk-annot-hl{outline:1px dashed #9fe !important;outline-offset:-1px}

/* ---------- workbench ---------- */
.wb{position:absolute;inset:0;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:var(--titlebar-h) minmax(0,1fr) var(--statusbar-h);background:var(--surface-canvas);overflow:hidden}
.wb-main{display:flex;min-height:0;position:relative}
.titlebar{display:flex;align-items:center;gap:8px;padding:0 8px 0 12px;background:var(--surface-sidebar);border-bottom:1px solid var(--border-default);font-size:var(--font-size-meta);color:var(--text-muted);user-select:none;position:relative;min-width:0}
.titlebar .center{position:absolute;left:50%;transform:translateX(-50%);max-width:56%;display:flex;justify-content:center}
.titlebar .right{margin-left:auto;display:flex;gap:2px;align-items:center}
.brand{display:flex;align-items:center;gap:6px;color:var(--text-primary);font-weight:600;font-size:var(--font-size-ui);white-space:nowrap}
.brand svg.i{color:var(--accent)}
.activitybar{width:var(--activitybar-w);flex:none;background:var(--surface-sidebar);border-right:1px solid var(--border-default);display:flex;flex-direction:column;align-items:center}
.activitybar .bottom{margin-top:auto}
.ab-item{width:var(--activitybar-w);height:48px;display:grid;place-items:center;color:var(--text-muted);border:0;background:none;cursor:pointer;position:relative;transition:color .15s}
.ab-item svg.i{width:22px;height:22px;stroke-width:1.1}
.ab-item:hover,.ab-item.active{color:var(--text-primary)}
.ab-item.active::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--accent)}
.ab-item .badge{position:absolute;right:7px;bottom:8px;min-width:16px;height:16px;border-radius:8px;background:var(--accent-emphasis);color:var(--text-on-emphasis);font-size:9px;font-weight:600;line-height:16px;text-align:center;padding:0 4px}
.sidebar{width:var(--sidebar-w);flex:none;background:var(--surface-sidebar);border-right:1px solid var(--border-default);display:flex;flex-direction:column;min-width:0;overflow:hidden}
.sidebar.hidden,.panel.hidden,.hidden{display:none !important}
.view-header{height:var(--view-header-h);display:flex;align-items:center;padding:0 8px 0 20px;font-size:var(--font-size-label);letter-spacing:.04em;text-transform:uppercase;color:var(--text-muted);flex:none;white-space:nowrap}
.view-header .actions,.pane-header .actions{margin-left:auto;display:flex;gap:2px;opacity:0;transition:opacity .15s}
.sidebar:hover .view-header .actions,.pane-header:hover .actions,.pane-header:focus-within .actions{opacity:1}
.pane{display:flex;flex-direction:column;min-height:0}
.pane.grow{flex:1}
.pane-header{height:var(--pane-header-h);display:flex;align-items:center;gap:2px;padding-right:8px;font-size:var(--font-size-label);font-weight:700;text-transform:uppercase;letter-spacing:.02em;cursor:pointer;color:var(--text-primary);border-top:1px solid var(--border-default);flex:none;user-select:none;white-space:nowrap}
.pane-header .twistie{width:20px}
.pane-header .count{margin-left:6px;font-weight:400;color:var(--text-muted);background:var(--surface-raised);border-radius:9px;padding:0 6px;line-height:16px;font-size:10px}
.pane-body{overflow:auto;min-height:0;flex:1}
.pane.collapsed .pane-body{display:none}
.pane.collapsed{flex:none}
.icon-btn{width:22px;height:22px;display:inline-grid;place-items:center;border:0;background:none;border-radius:var(--radius-control);color:var(--text-muted);cursor:pointer;transition:background .15s,color .15s;flex:none;padding:0}
.icon-btn:hover{background:var(--surface-hover);color:var(--text-primary)}
.icon-btn.on{background:var(--surface-active);color:var(--text-primary)}
.icon-btn:disabled{opacity:.4;cursor:default;background:none}
svg.i{width:16px;height:16px;display:block;flex:none}
.sash{width:4px;margin-left:-2px;margin-right:-2px;cursor:ew-resize;position:relative;z-index:5;flex:none;transition:background .15s .1s}
.sash:hover,.sash.dragging{background:var(--accent-emphasis)}
.editor{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--surface-canvas);position:relative}
.editor-title{height:var(--editor-title-h);display:flex;align-items:center;gap:8px;padding:0 8px 0 12px;border-bottom:1px solid var(--border-default);background:var(--surface-sidebar);flex:none;min-width:0;white-space:nowrap}
.editor-title .fname{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.editor-title .meta{color:var(--text-muted);font-size:var(--font-size-meta);font-family:var(--font-mono)}
.editor-title .actions{margin-left:auto;display:flex;gap:2px;align-items:center}
.editor-title .sep{width:1px;height:16px;background:var(--border-default);margin:0 4px}
.breadcrumbs{height:var(--breadcrumb-h);display:flex;align-items:center;gap:1px;padding:0 10px;font-size:var(--font-size-meta);color:var(--text-muted);border-bottom:1px solid var(--border-default);flex:none;white-space:nowrap;overflow:hidden}
.crumb{padding:0 3px;border-radius:3px;cursor:pointer;display:flex;align-items:center;gap:4px}
.crumb:hover{color:var(--text-primary);background:var(--surface-hover)}
.crumb-sep svg.i{width:12px;height:12px;opacity:.7}
.diff-wrap{flex:1;min-height:0;overflow:auto;position:relative}
.lc-plus{color:var(--status-added)}.lc-minus{color:var(--status-deleted)}

/* ---------- diff ---------- */
.diff{font-family:var(--font-mono);font-size:var(--font-size-code);line-height:var(--line-height-code);width:100%}
.diff-cols{position:sticky;top:0;z-index:3;display:grid;grid-template-columns:1fr 1fr;background:var(--surface-canvas);border-bottom:1px solid var(--border-default);font-family:var(--font-ui);font-size:var(--font-size-label);text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);line-height:22px}
.diff-cols>div{padding:0 12px;display:flex;gap:8px;align-items:center;min-width:0;white-space:nowrap}
.diff-cols>div:first-child{border-right:1px solid var(--border-default)}
.diff-cols b{color:var(--text-primary);font-weight:600}
.diff-cols .tag{margin-left:auto;font-weight:700}
.diff-cols .tag.del{color:var(--status-deleted)}.diff-cols .tag.add{color:var(--status-added)}
.diff.split .drow,.diff.split .diff-cols{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.drow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.side{display:grid;grid-template-columns:52px minmax(0,1fr);min-width:0}
.side.l{border-right:1px solid var(--border-default)}
.ln{color:var(--text-line-number);text-align:right;padding-right:10px;user-select:none;position:relative}
.code{white-space:pre;overflow:hidden;padding-left:4px;padding-right:16px;min-width:0}
.sign{display:inline-block;width:14px;color:var(--text-line-number);user-select:none}
.del .sign{color:var(--status-deleted)}.add .sign{color:var(--status-added)}
.side.del{background:var(--diff-del-bg)}
.side.add{background:var(--diff-add-bg)}
.side.empty{background:repeating-linear-gradient(-45deg,transparent 0 5px,var(--diff-empty-bg) 5px 6px)}
.intra-del{background:var(--diff-del-intra);border-radius:2px}
.intra-add{background:var(--diff-add-intra);border-radius:2px}
.sk{color:var(--syntax-keyword)}.ss{color:var(--syntax-string)}.sn{color:var(--syntax-number)}.st{color:var(--syntax-type)}.sc{color:var(--syntax-comment);font-style:italic}
.gap{display:flex;align-items:center;gap:6px;background:var(--surface-gap);color:var(--text-hunk);font-family:var(--font-ui);font-size:var(--font-size-meta);padding:0 12px;height:24px;cursor:pointer;border-block:1px solid var(--border-hunk);user-select:none}
.gap:hover{background:var(--surface-hunk)}
.gap .dim{margin-left:auto}
.flash>.side{animation:flash 1s ease}
@keyframes flash{0%{box-shadow:inset 3px 0 0 var(--accent),inset 0 0 0 999px rgb(121 184 255/14%)}100%{box-shadow:inset 3px 0 0 transparent}}
.diff.unified .urow{display:grid;grid-template-columns:44px 44px minmax(0,1fr)}
.diff.unified .urow.del{background:var(--diff-del-bg)}.diff.unified .urow.add{background:var(--diff-add-bg)}
.diff-unavail{display:flex;gap:12px;align-items:flex-start;padding:32px;color:var(--text-primary);font-size:var(--font-size-ui)}
.diff-unavail svg.i{color:var(--status-warning);margin-top:3px}
.commentable .ln[data-line]:not([data-line=""]):hover::before{content:'+';position:absolute;left:4px;top:2px;width:16px;height:16px;line-height:15px;text-align:center;border-radius:3px;background:var(--accent-emphasis);color:#fff;font-family:var(--font-ui);font-weight:700;cursor:pointer}
.commentable .ln[data-line]:not([data-line=""]){cursor:pointer}
.ln .glyph{position:absolute;left:5px;top:3px;color:var(--accent)}
.ln .glyph svg.i{width:13px;height:13px}

/* ---------- comment zones (Monaco view-zone shaped) ---------- */
.zone-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);font-family:var(--font-ui);font-size:var(--font-size-ui);line-height:var(--line-height-ui)}
.diff.unified .zone-row{grid-template-columns:1fr}
.zone-pad{background:var(--surface-canvas);border-right:1px solid var(--border-default)}
.zone-row .zone-pad:last-child{border-right:0}
.zone{padding:6px 16px 8px 56px;background:var(--surface-canvas);border-right:1px solid var(--border-default);min-width:0}
.diff.unified .zone{padding-left:96px;border-right:0}
.thread{border:1px solid var(--border-default);border-top:2px solid var(--accent);border-radius:0 0 var(--radius-overlay) var(--radius-overlay);background:var(--surface-panel);max-width:720px;white-space:normal}
.thread.resolved{border-top-color:var(--status-resolved)}
.thread.stale{border-top-color:var(--status-warning)}
.th-head{display:flex;align-items:center;gap:6px;white-space:nowrap;min-width:0;padding:2px 6px 2px 4px;font-size:var(--font-size-meta);color:var(--text-muted);cursor:pointer;user-select:none}
.th-head .title{color:var(--text-primary);font-weight:600;flex:none}
.th-head .th-state{flex:none}
.th-head .actions{margin-left:auto;display:flex;gap:2px}
.th-state{font-size:10px;text-transform:uppercase;letter-spacing:.04em;border:1px solid currentColor;border-radius:9px;padding:0 6px;line-height:15px}
.th-state.open{color:var(--accent)}.th-state.resolved{color:var(--status-resolved)}.th-state.stale{color:var(--status-warning)}
.th-body{padding:2px 12px 10px 28px;border-top:1px solid var(--border-default)}
.thread.collapsed .th-body{display:none}
.thread.collapsed .th-snippet{display:inline}
.th-snippet{display:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1;color:var(--text-muted)}
.cmt-meta{font-size:var(--font-size-meta);color:var(--text-muted);margin-top:6px}
.cmt-meta b{color:var(--text-primary);font-weight:600}
.cmt-text{margin-top:2px;color:var(--text-primary)}
.cmt-text code,.md code{font-family:var(--font-mono);font-size:12px;background:var(--surface-raised);padding:0 4px;border-radius:3px}
.stale-note{display:flex;gap:6px;align-items:center;margin-top:6px;color:var(--status-warning);font-size:var(--font-size-meta)}
.composer textarea,.textarea{width:100%;min-height:64px;resize:vertical;background:var(--surface-canvas);border:1px solid var(--border-control);border-radius:var(--radius-control);padding:6px 8px;color:var(--text-primary);line-height:1.5;outline:none}
.composer textarea:focus,.textarea:focus{border-color:var(--focus-ring)}
.composer .row-actions{display:flex;gap:6px;justify-content:flex-end;margin-top:6px;align-items:center}
.composer .hint{margin-right:auto;color:var(--text-muted);font-size:var(--font-size-meta)}

/* ---------- buttons ---------- */
.btn{height:26px;padding:0 12px;border-radius:var(--radius-control);border:1px solid var(--border-control);background:var(--surface-raised);color:var(--text-primary);cursor:pointer;font-size:var(--font-size-meta);transition:background .15s,border-color .15s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--surface-active)}
.btn.primary{background:var(--accent-emphasis);border-color:var(--accent-emphasis);color:var(--text-on-emphasis)}
.btn.primary:hover{background:var(--accent-emphasis-hover)}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:none;border-color:transparent;color:var(--text-muted)}
.btn.ghost:hover{background:var(--surface-hover);color:var(--text-primary)}

/* ---------- bottom panel ---------- */
.panel{height:var(--panel-h);border-top:1px solid var(--border-default);background:var(--surface-canvas);display:flex;flex-direction:column;flex:none;min-height:0}
.panel-tabs{height:35px;display:flex;align-items:center;gap:20px;padding:0 8px 0 20px;font-size:var(--font-size-label);text-transform:uppercase;letter-spacing:.04em;flex:none}
.ptab{border:0;background:none;color:var(--text-muted);padding:0;height:100%;cursor:pointer;border-bottom:1px solid transparent;display:flex;align-items:center;gap:6px;text-transform:uppercase;letter-spacing:.04em;font-size:var(--font-size-label)}
.ptab:hover{color:var(--text-primary)}
.ptab.active{color:var(--text-primary);border-bottom-color:var(--accent)}
.ptab .count{background:var(--surface-raised);border-radius:9px;padding:0 6px;line-height:16px;font-size:10px;text-transform:none}
.panel-tabs .actions{margin-left:auto;display:flex;gap:2px}
.panel-body{flex:1;min-height:0;overflow:auto}
.hsash{height:4px;margin-top:-2px;margin-bottom:-2px;cursor:ns-resize;position:relative;z-index:5;flex:none;transition:background .15s .1s}
.hsash:hover,.hsash.dragging{background:var(--accent-emphasis)}

/* ---------- status bar ---------- */
.statusbar{display:flex;align-items:stretch;background:var(--statusbar-bg);color:var(--statusbar-fg);font-size:var(--font-size-meta);border-top:1px solid var(--border-default);user-select:none;white-space:nowrap;overflow:hidden;min-width:0}
.sb-item{height:100%;display:flex;align-items:center;gap:4px;padding:0 7px;border:0;background:none;color:inherit;cursor:pointer;font-size:var(--font-size-meta);transition:background .12s}
.sb-item:hover{background:var(--surface-hover);color:var(--text-primary)}
.sb-item svg.i{width:14px;height:14px}
.sb-item.emph{background:var(--statusbar-emphasis-bg);color:var(--statusbar-emphasis-fg)}
.sb-item.warn{background:var(--status-warning-background);color:var(--status-warning)}
.sb-item.static{cursor:default}
.sb-item.static:hover{background:none;color:inherit}
.sb-spacer{flex:1;min-width:8px}
.mono{font-family:var(--font-mono)}

/* ---------- lists / tree ---------- */
.list{outline:none;padding-bottom:8px}
.row{height:var(--row-h);display:flex;align-items:center;gap:5px;padding-right:10px;cursor:pointer;white-space:nowrap;color:var(--text-primary);position:relative;border:1px solid transparent;user-select:none;min-width:0}
.row:hover{background:var(--surface-hover)}
.row.selected{background:var(--selection-background)}
.list:focus .row.selected,.list:focus-within .row.selected{border-color:var(--focus-ring)}
.twistie{width:16px;display:grid;place-items:center;color:var(--text-muted);flex:none}
.twistie svg.i{width:14px;height:14px}
.ft{font:700 8.5px/1 var(--font-mono);width:20px;text-align:center;flex:none;letter-spacing:-.02em}
.ft.ts{color:var(--syntax-type)}.ft.vue{color:var(--status-added)}.ft.css{color:var(--status-resolved)}.ft.md{color:var(--text-muted)}.ft.img{color:var(--status-warning)}
.folder-ic{color:var(--text-muted)}
.name{overflow:hidden;text-overflow:ellipsis;min-width:0}
.dim{color:var(--text-muted)}
.path-dim{color:var(--text-muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1 1 auto}
.deco{margin-left:auto;font:600 11px/1 var(--font-mono);flex:none;width:12px;text-align:center}
.deco.M{color:var(--status-modified)}.deco.A{color:var(--status-added)}.deco.D{color:var(--status-deleted)}.deco.U{color:var(--status-warning)}
.row.f-M .name{color:var(--status-modified)}.row.f-A .name{color:var(--status-added)}.row.f-D .name{color:var(--status-deleted);text-decoration:line-through}
.row.f-U .name{color:var(--text-muted)}
.row.folder.has-M>.name,.row.folder.has-A>.name{color:var(--text-primary)}
.counts{font:11px var(--font-mono);flex:none;margin-left:auto;display:flex;gap:6px}
.counts+.deco{margin-left:6px}
.cbadge{display:inline-flex;align-items:center;gap:2px;color:var(--accent);font-size:11px;flex:none;margin-left:auto}
.cbadge+.counts,.cbadge+.deco{margin-left:8px}
.cbadge svg.i{width:12px;height:12px}
.empty-msg{padding:12px 20px;color:var(--text-muted);font-size:var(--font-size-meta)}

/* ---------- overlays ---------- */
.toasts{position:absolute;right:12px;bottom:calc(var(--statusbar-h) + 10px);display:flex;flex-direction:column;gap:8px;z-index:50;pointer-events:none}
.toast{pointer-events:auto;min-width:300px;max-width:420px;background:var(--surface-panel);border:1px solid var(--border-overlay);border-radius:var(--radius-overlay);box-shadow:var(--shadow-overlay);padding:10px 12px;display:flex;gap:10px;align-items:flex-start;animation:toastIn .18s ease}
.toast svg.i{color:var(--accent);margin-top:3px}
.toast .t-actions{margin-top:6px;display:flex;gap:6px}
@keyframes toastIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.popover{position:absolute;z-index:40;background:var(--surface-panel);border:1px solid var(--border-overlay);border-radius:var(--radius-overlay);box-shadow:var(--shadow-overlay);animation:toastIn .14s ease;min-width:280px}
.popover .pop-head{padding:8px 12px;border-bottom:1px solid var(--border-default);font-size:var(--font-size-label);text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);display:flex;align-items:center;gap:6px}
.kv{display:grid;grid-template-columns:96px minmax(0,1fr);gap:2px 12px;padding:8px 12px;font-size:var(--font-size-meta)}
.kv dt{color:var(--text-muted)}.kv dd{margin:0;font-family:var(--font-mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pop-actions{display:flex;gap:6px;justify-content:flex-end;padding:8px 12px;border-top:1px solid var(--border-default)}
.scrim{position:absolute;inset:0;background:var(--surface-scrim);z-index:30;animation:fadeIn .15s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.kbd{font:11px var(--font-mono);border:1px solid var(--border-control);border-bottom-width:2px;border-radius:3px;padding:0 4px;color:var(--text-muted)}
.banner{display:flex;gap:8px;align-items:center;padding:6px 12px;font-size:var(--font-size-meta);border-bottom:1px solid var(--border-default)}
.banner.warn{background:var(--status-warning-background);color:var(--status-warning)}
.banner .btn{margin-left:auto}

/* ---------- narrow widths: sidebar becomes an overlay, diff goes inline ---------- */
@container stage (max-width: 760px){
  .sidebar{position:absolute;left:var(--activitybar-w);top:0;bottom:0;z-index:20;box-shadow:var(--shadow-overlay)}
  .titlebar .center{display:none}

  const base = c.baseKind==='branch' ? `${c.baseLabel} @ ${c.baseSha}` : `${c.baseLabel} ${c.baseSha}`;
  const head = c.headKind==='patch' ? `Exact patch (${c.patchFrom}, ${c.patchFiles} files)` : c.headKind==='index' ? 'Staged changes' : `${c.headLabel} @ ${c.headSha}`;
  return { base, head };
};

/* ---------- review surfaces shared by panel / sidebar / overlay placements ---------- */
function renderCommentsList(R, { compact=false } = {}){
  const s = R.s; if (!s.threads.length) return `<div class="empty-msg">No comments yet. Hover a line number in the diff and click <b>+</b>.</div>`;
  const byFile = new Map(); s.threads.forEach(t => { if (!byFile.has(t.path)) byFile.set(t.path, []); byFile.get(t.path).push(t); });
  let h = '<div class="list">';
  byFile.forEach((ts, p) => {
    const f = fileByPath(p);
    h += `<div class="row folder" style="padding-left:12px;cursor:default"><span class="twistie">${icon('down')}</span>${ftBadge(f)}<span class="name">${esc(f.name)}</span><span class="path-dim">${compact?'':esc(f.dir)}</span><span class="count dim" style="margin-left:auto;font-size:11px">${ts.length}</span></div>`;
    ts.sort((a,b)=>a.line-b.line).forEach(t => {
      const st = t.stale && t.state==='open' ? 'stale' : t.state;
      const ic = st==='resolved' ? `<span style="color:var(--status-resolved)">${icon('resolve')}</span>` : st==='stale' ? `<span style="color:var(--status-warning)">${icon('warning')}</span>` : `<span style="color:var(--accent)">${icon('comment')}</span>`;
      h += `<div class="row" data-act="goto-thread" data-id="${t.id}" style="padding-left:${compact?40:52}px" title="${esc(ctx(t.comments[0].text))}">${ic}<span class="name" style="${st==='resolved'?'color:var(--text-muted)':''}">${fmt(ctx(t.comments[0].text)).replace(/<br>/g,' ')}</span><span class="dim mono" style="margin-left:auto;padding-left:8px;font-size:11px;flex:none">${t.side==='base'?'B':'H'}${t.line}</span></div>`;
    });
  });
  return h + '</div>';
}
function renderSummaryEditor(R){
  return `<div style="padding:8px 16px 12px;display:flex;flex-direction:column;gap:6px;height:100%">
    <div class="dim" style="font-size:var(--font-size-meta);display:flex;gap:6px;align-items:center;white-space:nowrap;overflow:hidden">Overall summary · Markdown<span style="margin-left:auto;display:flex;align-items:center;gap:4px" data-saved>${icon('check','')}<span data-saved-text>Saved</span></span></div>
    <textarea class="textarea summary-input" style="flex:1;min-height:90px">${esc(R.s.summary)}</textarea></div>`;
}
function renderExportBox(R){
  const s = R.s, c = R.counts();
  if (s.exportState === 'writing') return `<div style="padding:16px"><div style="display:flex;gap:8px;align-items:center">${icon('refresh')}Writing review.json and review.md…</div><div style="margin-top:10px;height:2px;background:var(--surface-raised);overflow:hidden"><div style="height:100%;width:40%;background:var(--accent);animation:prog 0.9s linear infinite"></div></div><style>@keyframes prog{from{transform:translateX(-100%)}to{transform:translateX(250%)}}</style></div>`;
  if (s.exportState === 'done') return `<div style="padding:12px 16px">
    <div style="display:flex;gap:8px;align-items:center;color:var(--status-added)">${icon('check')}<b>Exported</b><span class="dim">· an agent can apply it now</span></div>
    ${['review.md','review.json'].map(n => `<div style="display:flex;align-items:center;gap:8px;margin-top:8px;font-family:var(--font-mono);font-size:12px;background:var(--surface-panel);border:1px solid var(--border-default);border-radius:var(--radius-control);padding:4px 4px 4px 8px"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">.loopnote/exports/${s.exportId}/${n}</span><button class="icon-btn" style="margin-left:auto" data-act="copy" title="Copy path">${icon('copy')}</button></div>`).join('')}
    <div style="margin-top:10px;display:flex;gap:6px"><button class="btn" data-act="copy">${icon('copy')}Copy agent prompt</button><button class="btn ghost" data-act="export-again">Export again</button></div></div>`;
  const staleRow = c.stale ? `<label style="display:flex;gap:8px;align-items:flex-start;color:var(--status-warning);cursor:pointer"><input type="checkbox" data-ack ${s.ack?'checked':''} style="margin-top:4px"><span>${c.stale} comment's anchor moved. Export it marked <b>stale</b>.</span></label>` : '';
  const ready = !c.stale || s.ack;
  return `<div style="padding:10px 16px;display:flex;flex-direction:column;gap:6px;font-size:var(--font-size-ui)">
    <div style="display:flex;gap:8px;align-items:center">${icon('comment')}<span>${c.open} open · ${c.resolved} resolved comments</span></div>
    <div style="display:flex;gap:8px;align-items:center">${icon('notes')}<span>${s.summary.trim() ? 'Summary written' : '<span class="dim">No summary (optional)</span>'}</span></div>
    <div style="display:flex;gap:8px;align-items:center">${icon('eye')}<span>${c.viewed}/${c.files} files viewed</span><span class="dim">· not required</span></div>
    ${staleRow}
    <div style="display:flex;gap:6px;margin-top:4px"><button class="btn primary" data-act="do-export" ${ready?'':'disabled'}>${icon('export')}Export review</button><span class="dim" style="align-self:center;font-size:var(--font-size-meta)">Writes Markdown + canonical JSON to <span class="mono">.loopnote/exports/</span></span></div></div>`;
}
function wireReviewSurfaces(R, rerenderSurfaces){
  R.root.addEventListener('input', e => {
    if (e.target.classList.contains('summary-input')) {
      R.s.summary = e.target.value; const box = e.target.parentElement; const t = box.querySelector('[data-saved-text]');
      if (t) { t.textContent = 'Saving…'; clearTimeout(R._sv); R._sv = setTimeout(() => t.textContent = 'Saved', 500); }
    }
  });
  R.root.addEventListener('change', e => { if (e.target.matches('[data-ack]')) { R.s.ack = e.target.checked; rerenderSurfaces(); } });
  Object.assign(R.actions, {
    'goto-thread': (el) => { const t = R.s.threads.find(x => x.id===el.dataset.id); if (!t) return; t.collapsed = false; if (R.s.file !== t.path) R.open(t.path); else R.render(); setTimeout(() => { const th = R.diffEl().querySelector(`[data-thread="${t.id}"]`); th && th.scrollIntoView({ block:'center', behavior:'smooth' }); th && (th.style.outline='1px solid var(--focus-ring)', setTimeout(()=>th.style.outline='',900)); }, 30); R.onGoto && R.onGoto(t); },
    'do-export': () => R.doExport(() => toast(R.root, `${icon('check')}<div><b>Review exported</b><div class="dim mono" style="font-size:11px">.loopnote/exports/${R.s.exportId}/</div></div>`, 3500)),
    'export-again': () => { R.s.exportState='idle'; rerenderSurfaces(); },
    'copy': (el) => { const o = el.innerHTML; el.innerHTML = icon('check') + (el.classList.contains('btn') ? 'Copied' : ''); setTimeout(() => el.innerHTML = o, 1200); },
  });
}
</script>
<script>
const SHELL = kind => `
 <div class="wb">
  <div class="titlebar"><span class="brand">${icon('logo')} Loopnote</span><span class="center"><span class="dim mono" style="font-size:12px">main 4f2a91c → feat/support-payments 9c03e7d</span></span>
   <span class="right">${kind==='panel' ? `<button class="icon-btn" data-act="toggle-panel" title="Toggle Review panel (⌘J)">${icon('panel')}</button>` : ''}</span></div>
  <div class="wb-main">
   <nav class="activitybar">
    <button class="ab-item active" data-view="files" title="Changed files">${icon('files')}</button>
    ${kind==='side' ? `<button class="ab-item" data-view="review" title="Review (⇧⌘R)">${icon('comment')}<span class="badge" data-badge></span></button>` : ''}
   </nav>
   <aside class="sidebar">
    <div data-sview="files" style="display:flex;flex-direction:column;min-height:0;flex:1"><div class="view-header"><span>Changed files</span></div><div style="flex:1;min-height:0;overflow:auto"><div class="files-list list" role="tree"></div></div></div>
    ${kind==='side' ? `<div data-sview="review" class="review-view hidden" style="display:flex;flex-direction:column;min-height:0;flex:1">
      <div class="view-header"><span>Review</span></div>

      <div class="pane"><div class="pane-header" data-pane-toggle><span class="twistie">${icon('down')}</span>Summary</div><div class="pane-body" data-summary style="height:150px;flex:none"></div></div>
      <div class="pane"><div class="pane-header" data-pane-toggle><span class="twistie">${icon('down')}</span>Export</div><div class="pane-body" data-export style="flex:none"></div></div>
    </div>` : ''}
   </aside>
   <div class="sash" data-sash></div>

      <button class="icon-btn" data-act="prev-file" title="Previous file">${icon('prevFile')}</button>
      <button class="icon-btn" data-act="next-file" title="Next file">${icon('nextFile')}</button>
      <button class="icon-btn" data-act="toggle-mode" title="Toggle inline / side by side">${icon('split')}</button></span></div>
    <div class="diff-wrap"></div>
    ${kind==='panel' ? `<div class="hsash" data-hsash></div><section class="panel" aria-label="Review">
      <div class="panel-tabs"><button class="ptab active" data-ptab="comments">Comments <span class="count" data-pc></span></button><button class="ptab" data-ptab="summary">Summary</button><button class="ptab" data-ptab="export">Export</button>
      <span class="actions"><button class="icon-btn" data-act="toggle-panel" title="Close (⌘J)">${icon('x')}</button></span></div><div class="panel-body"></div></section>` : ''}
   </div>
  </div>
  <footer class="statusbar"><button class="sb-item">${icon('lock')}<span class="mono">a5f6387</span></button><span class="sb-spacer"></span>
   <button class="sb-item" data-act="sb-comments" data-sbc></button>
   ${kind==='overlay' ? `<button class="sb-item emph" data-act="finish">${icon('export')}Finish review</button>` : `<button class="sb-item static hide-narrow">Draft saved</button>`}</footer>
 </div>`;

function setup(id, kind){
  const root = document.getElementById('variant-'+id); root.innerHTML = SHELL(kind);
  let ptab = 'comments', finishEl = null;
  const surfaces = () => {
    if (kind==='panel') {
      const body = root.querySelector('.panel-body');
      body.innerHTML = ptab==='comments' ? renderCommentsList(R) : ptab==='summary' ? renderSummaryEditor(R) : renderExportBox(R);
      root.querySelectorAll('.ptab').forEach(t => t.classList.toggle('active', t.dataset.ptab===ptab));
    }
    if (kind==='side') {
      root.querySelector('[data-comments]').innerHTML = renderCommentsList(R, { compact:true });
      const se = root.querySelector('[data-summary]'); if (!se.querySelector('textarea') || document.activeElement !== se.querySelector('textarea')) se.innerHTML = renderSummaryEditor(R);
      root.querySelector('[data-export]').innerHTML = renderExportBox(R).replace(/<span class="dim" style="align-self:center;font-size:var\(--font-size-meta\)">.*?<\/span><\/span><\/div>/s,'</div>');
    }
    if (kind==='overlay' && finishEl) renderFinish();
  };
  const R = createReview(root, { onChange: R2 => { chrome(R2); R && surfaces(); } });
  wireReviewSurfaces(R, surfaces);
  sash(root.querySelector('[data-sash]'), root.querySelector('.sidebar'));
  const hs = root.querySelector('[data-hsash]'), pnl = root.querySelector('.panel'); if (hs) sash(hs, pnl, { axis:'y', min:120, max:520, invert:true });
  function chrome(R){
    const f = R.file(), k = R.counts();
    root.querySelector('[data-ftitle]').textContent = f.name;
    root.querySelector('[data-fmeta]').innerHTML = f.unsupported ? '' : `<span class="deco ${f.status}" style="display:inline;margin-right:6px">${f.status}</span><span class="lc-plus">+${f.add}</span> <span class="lc-minus">−${f.del}</span>`;
    const ts = R.s.threads.filter(t => t.path===R.s.file);
    root.querySelector('[data-tpos]').textContent = ts.length ? `${ts.length} comment${ts.length>1?'s':''}` : 'no comments';
    root.querySelector('[data-sbc]').innerHTML = `${icon('comment')}${k.open} open${k.stale?` · <span style="color:var(--status-warning)">${k.stale} stale</span>`:''}`;
    const b = root.querySelector('[data-badge]'); if (b) { b.textContent = k.open; b.style.display = k.open ? '' : 'none'; }
    const pc = root.querySelector('[data-pc]'); if (pc) pc.textContent = R.s.threads.length;
    const cc = root.querySelector('[data-cc]'); if (cc) cc.textContent = R.s.threads.length;
    root.querySelector('[data-act="toggle-mode"]').innerHTML = icon(R.s.mode==='split'?'split':'inline');
  }
  // thread navigation across all files (VS Code "Go to next comment thread")
  let tIdx = -1;
  const ordered = () => R.s.threads.slice().sort((a,b) => (FILES.findIndex(f=>f.path===a.path) - FILES.findIndex(f=>f.path===b.path)) || a.line - b.line);
  const gotoThread = dir => { const ts = ordered(); if (!ts.length) return; tIdx = (tIdx + dir + ts.length) % ts.length; const el = document.createElement('i'); el.dataset.id = ts[tIdx].id; R.actions['goto-thread'](el); };
  const setSide = v => {
    root.querySelectorAll('[data-sview]').forEach(x => x.classList.toggle('hidden', x.dataset.sview!==v));
    root.querySelectorAll('.ab-item[data-view]').forEach(b => b.classList.toggle('active', b.dataset.view===v));
    root.querySelector('.sidebar').classList.remove('hidden'); surfaces();
  };
  root.querySelectorAll('.ab-item[data-view]').forEach(b => b.addEventListener('click', () => setSide(b.dataset.view)));
  root.querySelectorAll('[data-pane-toggle]').forEach(h => h.addEventListener('click', () => { const p = h.closest('.pane'); p.classList.toggle('collapsed'); h.querySelector('.twistie').innerHTML = icon(p.classList.contains('collapsed')?'right':'down'); }));
  root.querySelectorAll('.ptab').forEach(t => t.addEventListener('click', () => { ptab = t.dataset.ptab; surfaces(); }));
  const showPanel = (tab, show=true) => { if (!pnl) return; pnl.classList.toggle('hidden', !show); hs.classList.toggle('hidden', !show); root.querySelector('.titlebar [data-act="toggle-panel"]').classList.toggle('on', show); if (tab) ptab = tab; surfaces(); };
  function renderFinish(){
    finishEl.querySelector('.f-body').innerHTML = `<div class="sect">Comments</div>${renderCommentsList(R, { compact:true })}<div class="sect">Summary</div>${renderSummaryEditor(R).replace('height:100%','')}<div class="sect">Export</div>${renderExportBox(R)}`;
  }
  const openFinish = () => {
    if (finishEl) { closeFinish(); return; }

    const scrim = document.createElement('div'); scrim.className = 'scrim'; scrim.addEventListener('click', closeFinish);
    finishEl = document.createElement('section'); finishEl.className = 'finish'; finishEl.setAttribute('role','dialog'); finishEl.setAttribute('aria-label','Finish review');
    finishEl.innerHTML = `<div class="f-head">${icon('export')}Finish review<span class="dim" style="font-weight:400;font-size:12px">· Esc to keep reading</span><span class="actions"><button class="icon-btn" data-close title="Close (Esc)">${icon('x')}</button></span></div><div class="f-body"></div>`;

  };
  function closeFinish(){ if (!finishEl) return; finishEl._scrim.remove(); finishEl.remove(); finishEl = null; }
  Object.assign(R.actions, {
    'toggle-panel': () => showPanel(null, pnl.classList.contains('hidden')),
    'next-thread': () => gotoThread(1), 'prev-thread': () => gotoThread(-1),
    'fold-threads': (el) => { const anyOpen = R.s.threads.some(t => t.path===R.s.file && !t.collapsed); R.s.threads.forEach(t => { if (t.path===R.s.file) t.collapsed = anyOpen; }); el.innerHTML = icon(anyOpen ? 'down' : 'collapse'); el.title = anyOpen ? 'Expand all comments' : 'Collapse all comments'; R.renderDiff(); },
    'sb-comments': () => kind==='panel' ? showPanel('comments') : kind==='side' ? setSide('review') : gotoThread(1),
    'finish': openFinish,
  });
  root.addEventListener('keydown', e => { if (e.key==='Escape' && finishEl) closeFinish(); });
  const setState = st => {
    closeFinish(); R.s.threads = seedThreads(); R.s.composer = null; R.s.exportState = 'idle'; R.s.ack = false; R.s.file = 'src/server/support-client.ts';
    if (kind==='panel') showPanel('comments', false);

    if (st==='composing') R.s.composer = { side:'head', line:45 };
    R.render();
    if (st==='composing') setTimeout(() => { const d = R.diffEl(); const z = d.querySelector('[data-composer]'); z && z.scrollIntoView({ block:'center' }); }, 0);
    if (st==='finishing' || st==='exported') {
      if (st==='exported') { R.s.ack = true; R.s.exportState = 'done'; R.s.exportId = '2026-11-04T10-42-17Z'; }
      if (kind==='panel') showPanel('export'); else if (kind==='side') setSide('review'); else openFinish();

}
const V = { a: setup('a','panel'), b: setup('b','side'), c: setup('c','overlay') };
initChrome({ title:'004 Comment threads',

  onState: s => Object.values(V).forEach(v => v.setState(s)) });
document.addEventListener('keydown', e => {
  const v = document.querySelector('.variant.active'); if (!v || e.target.matches('input,textarea')) return;
  const click = sel => { const el = v.querySelector(sel); el && el.click(); };
  if ((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='j') { e.preventDefault(); click('.titlebar [data-act="toggle-panel"]'); }
  if (e.key==='F9' && e.altKey) { e.preventDefault(); click(e.shiftKey ? '[data-act="prev-thread"]' : '[data-act="next-thread"]'); }
  if (e.key==='F7') { e.preventDefault(); click(e.shiftKey ? '[data-act="prev-change"]' : '[data-act="next-change"]'); }
});

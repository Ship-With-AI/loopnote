name: Deploy Supabase production

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: supabase-production
  cancel-in-progress: false

jobs:
  repository-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.7.14
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck:tests
      - run: npx playwright install --with-deps chromium
      - run: npx vitest run --no-file-parallelism
      - run: npx playwright test
      - run: deno test --allow-env --config supabase/functions/deno.json supabase/functions/tests
      - run: npx supabase@2.114.0 db start
      - run: npx supabase@2.114.0 db reset --local --no-seed
      - run: npx supabase@2.114.0 test db
      - run: npx supabase@2.114.0 migration list --local
      - run: npx supabase@2.114.0 db lint --local

  deploy-production:
    needs: repository-gates
    runs-on: ubuntu-latest
    environment: production
    env:
      LOOPNOTE_DEPLOYMENT_ENVIRONMENT: production
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_GITHUB_CLIENT_SECRET: ${{ secrets.SUPABASE_GITHUB_CLIENT_SECRET }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      SUPPORT_PROVIDER_MODE: ${{ vars.SUPPORT_PROVIDER_MODE }}
      SUPABASE_GITHUB_CLIENT_ID: ${{ vars.SUPABASE_GITHUB_CLIENT_ID }}
      STRIPE_PRICE_ID: ${{ vars.STRIPE_PRICE_ID }}
      STRIPE_WEBHOOK_ENDPOINT_ID: ${{ vars.STRIPE_WEBHOOK_ENDPOINT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Guard canonical Supabase target
        run: |
          [[ "$SUPABASE_PROJECT_REF" =~ ^[a-z0-9]{20}$ ]] || exit 1
      - name: Deploy guarded Supabase release
        run: |
          # v1.4 milestone archive: the phase directory was deleted when v1.4 closed.
          acceptance=.planning/milestones/v1.4-phases/02-move-the-implementation-to-supabase/02-09-ACCEPTANCE-EVIDENCE.md
          args=(--run-deployment --mode "$SUPPORT_PROVIDER_MODE" --evidence supabase-deployment-evidence.json)
          if [ "$SUPPORT_PROVIDER_MODE" = prelaunch-test ] && [ -f "$acceptance" ]; then
            args+=(--acceptance "$acceptance")
          elif [ "$SUPPORT_PROVIDER_MODE" != production-live ]; then
            exit 1
          fi
          node scripts/verify-supabase-support.mjs "${args[@]}"
      - name: Verify configured deployment runtime package
        run: |
          [[ "$SUPABASE_PROJECT_REF" =~ ^[a-z0-9]{20}$ ]] || exit 1
          origin="https://${SUPABASE_PROJECT_REF}.supabase.co"
          temporary="$(mktemp -d)"
          custody="$temporary/custody"
          evidence="$temporary/runtime-artifact-evidence.json"
          cleanup() { rm -rf "$temporary"; }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          export LOOPNOTE_RELEASE_SUPPORT_SERVICE_URL="$origin"
          node scripts/pack-runtime.mjs --purpose deployment-check --custody-dir "$custody" --evidence "$evidence"
          archive_basename="$(node -e "process.stdout.write(JSON.parse(require('node:fs').readFileSync(process.argv[1], 'utf8')).archive.basename)" "$evidence")"
          archive="$custody/$archive_basename"
          expected_sha256="$(node -e "process.stdout.write(JSON.parse(require('node:fs').readFileSync(process.argv[1], 'utf8')).archive.sha256)" "$evidence")"
          node scripts/verify-production-artifacts.mjs --archive "$archive" --expected-sha256 "$expected_sha256" --evidence "$evidence"
      - uses: actions/upload-artifact@v4
        with:
          name: supabase-production-release-${{ github.run_id }}
          path: supabase-deployment-evidence.json
          if-no-files-found: error
          retention-days: 90
